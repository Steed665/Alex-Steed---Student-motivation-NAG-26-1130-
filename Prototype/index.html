
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Motivation</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Student Motivation</h1>

    <section id="account-section">
      <h2 id="account-heading">Log in</h2>

      <form id="login-form">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" required>

        <label for="login-password">Password</label>
        <input type="password" id="login-password" required>

        <button type="submit">Log in</button>
      </form>

      <form id="signup-form" hidden>
        <label for="signup-name">Name</label>
        <input type="text" id="signup-name" required>

        <label for="signup-email">Email</label>
        <input type="email" id="signup-email" required>

        <label for="signup-password">Password (at least 6 characters)</label>
        <input type="password" id="signup-password" minlength="6" required>

        <button type="submit">Sign up</button>
      </form>

      <p id="account-error" role="status"></p>
      <button id="switch-form" type="button">Create an account</button>
      <p>Demo account: demo@hull.ac.uk / Password123</p>
    </section>

    <section id="dashboard" hidden>
      <p>Logged in as <strong id="user-name"></strong> <button id="logout" type="button">Log out</button></p>

      <h2>Upcoming deadlines</h2>
      <ul id="upcoming-deadlines"></ul>

      <h2>Assignment tasks</h2>
      <div id="assignment-tasks"></div>

      <h2>Monthly calendar</h2>
      <div id="calendar-controls">
        <button id="previous-month" type="button">Previous</button>
        <strong id="month-title" aria-live="polite"></strong>
        <button id="next-month" type="button">Next</button>
        <button id="current-month" type="button">This month</button>
      </div>

      <div class="calendar-scroll">
        <table id="calendar">
          <thead>
            <tr>
              <th scope="col">Mon</th><th scope="col">Tue</th><th scope="col">Wed</th>
              <th scope="col">Thu</th><th scope="col">Fri</th><th scope="col">Sat</th><th scope="col">Sun</th>
            </tr>
          </thead>
          <tbody id="calendar-body"></tbody>
        </table>
      </div>

      <h2>Add class session</h2>
      <form id="class-form">
        <label for="class-name">Module</label>
        <input id="class-name" type="text" required>

        <label for="class-day">Day of the week</label>
        <select id="class-day">
          <option>Monday</option><option>Tuesday</option><option>Wednesday</option>
          <option>Thursday</option><option>Friday</option>
          <option>Saturday</option><option>Sunday</option>
        </select>

        <label for="class-start">Start time</label>
        <input id="class-start" type="time" required>

        <label for="class-end">End time</label>
        <input id="class-end" type="time" required>

        <label for="class-first-date">First date</label>
        <input id="class-first-date" type="date" required>

        <label for="class-last-date">Last date</label>
        <input id="class-last-date" type="date" required>

        <button type="submit">Add class</button>
      </form>
      <p id="class-error" role="status"></p>

      <h2>Add assignment</h2>
      <form id="assignment-form">
        <label for="assignment-name">Assignment</label>
        <input id="assignment-name" type="text" required>

        <label for="assignment-module">Module</label>
        <input id="assignment-module" type="text" required>

        <label for="assignment-date">Due date</label>
        <input id="assignment-date" type="date" required>

        <button type="submit">Add assignment</button>
      </form>

      <h2>Add personal event</h2>
      <form id="personal-form">
        <label for="personal-name">Event</label>
        <input id="personal-name" type="text" required>

        <label for="personal-date">Date</label>
        <input id="personal-date" type="date" required>

        <label for="personal-time">Time (optional)</label>
        <input id="personal-time" type="time">

        <button type="submit">Add event</button>
      </form>
    </section>
  </main>
</body>
</html>
